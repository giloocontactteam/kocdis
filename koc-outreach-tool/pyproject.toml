[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "outreach"
version = "0.1.0"
description = "Skill-based KOC outreach data-enrichment toolkit (Instagram + email discovery)"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40",
    "openpyxl>=3.1",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
